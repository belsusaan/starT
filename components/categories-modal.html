<!-- ==========================================
     COMPONENT: MANAGE CATEGORIES MODAL
     Modal dialog to add/edit categories with name input,
     12 color swatch pickers, existing categories list with edit/delete icons.
     ========================================== -->
<div id="categories-modal"
  class="fixed inset-0 z-50 hidden items-center justify-center p-4 bg-slate-900/40 dark:bg-black/60 backdrop-blur-sm transition-all duration-300"
  role="dialog" aria-labelledby="categories-modal-title" aria-modal="true">
  <div
    class="bg-white dark:bg-dark-card rounded-3xl p-6 w-full max-w-md shadow-2xl border border-slate-100 dark:border-dark-border transform transition-all flex flex-col gap-5 animate-task-appear">
    <!-- Header -->
    <div class="flex items-center justify-between">
      <h3 id="categories-modal-title" class="font-title text-lg font-bold text-slate-800 dark:text-slate-50">Gestionar Materias</h3>
      <button onclick="closeManageCategories()"
        class="p-1 text-slate-400 hover:text-slate-600 dark:hover:text-slate-200 rounded-lg cursor-pointer">
        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor"
          class="w-5 h-5">
          <path stroke-linecap="round" stroke-linejoin="round" d="M6 18 18 6M6 6l12 12" />
        </svg>
      </button>
    </div>

    <!-- Add / Edit Category Form -->
    <div class="flex flex-col gap-3 p-3.5 bg-slate-50 dark:bg-dark-hover rounded-2xl border border-slate-100 dark:border-dark-border">
      <div class="flex flex-col gap-1">
        <label for="cat-name-input" id="cat-form-legend"
          class="text-xs font-semibold text-slate-500 dark:text-slate-400">Nueva Materia</label>
        <input type="text" id="cat-name-input" placeholder="Nombre de la materia..."
          class="w-full px-3.5 py-2 rounded-xl border border-slate-200 dark:border-dark-border bg-white dark:bg-dark-card text-xs text-slate-700 dark:text-slate-200 focus:outline-none focus:border-pastel-pink-300 font-sans">
      </div>

      <!-- Color Circle Swatches for instant visual picking -->
      <div class="flex items-center gap-1.5 flex-wrap pt-1" id="cat-swatches-container">
        <button type="button" onclick="selectCategoryColorSwatch('pastel-pink')" class="cat-swatch w-5 h-5 rounded-full bg-[#F472B6] border-2 border-white dark:border-dark-card shadow-sm hover:scale-110 transition-transform cursor-pointer" title="Rosa Pastel"></button>
        <button type="button" onclick="selectCategoryColorSwatch('pastel-blue')" class="cat-swatch w-5 h-5 rounded-full bg-[#38BDF8] border-2 border-white dark:border-dark-card shadow-sm hover:scale-110 transition-transform cursor-pointer" title="Azul Cielo"></button>
        <button type="button" onclick="selectCategoryColorSwatch('pastel-lavender')" class="cat-swatch w-5 h-5 rounded-full bg-[#A855F7] border-2 border-white dark:border-dark-card shadow-sm hover:scale-110 transition-transform cursor-pointer" title="Lavanda"></button>
        <button type="button" onclick="selectCategoryColorSwatch('pastel-mint')" class="cat-swatch w-5 h-5 rounded-full bg-[#34D399] border-2 border-white dark:border-dark-card shadow-sm hover:scale-110 transition-transform cursor-pointer" title="Menta Verde"></button>
        <button type="button" onclick="selectCategoryColorSwatch('pastel-peach')" class="cat-swatch w-5 h-5 rounded-full bg-[#FB923C] border-2 border-white dark:border-dark-card shadow-sm hover:scale-110 transition-transform cursor-pointer" title="Durazno"></button>
        <button type="button" onclick="selectCategoryColorSwatch('pastel-yellow')" class="cat-swatch w-5 h-5 rounded-full bg-[#FBBF24] border-2 border-white dark:border-dark-card shadow-sm hover:scale-110 transition-transform cursor-pointer" title="Amarillo Miel"></button>
        <button type="button" onclick="selectCategoryColorSwatch('pastel-coral')" class="cat-swatch w-5 h-5 rounded-full bg-[#F87171] border-2 border-white dark:border-dark-card shadow-sm hover:scale-110 transition-transform cursor-pointer" title="Coral Suave"></button>
        <button type="button" onclick="selectCategoryColorSwatch('pastel-teal')" class="cat-swatch w-5 h-5 rounded-full bg-[#2DD4BF] border-2 border-white dark:border-dark-card shadow-sm hover:scale-110 transition-transform cursor-pointer" title="Turquesa"></button>
        <button type="button" onclick="selectCategoryColorSwatch('pastel-emerald')" class="cat-swatch w-5 h-5 rounded-full bg-[#10B981] border-2 border-white dark:border-dark-card shadow-sm hover:scale-110 transition-transform cursor-pointer" title="Esmeralda"></button>
        <button type="button" onclick="selectCategoryColorSwatch('pastel-purple')" class="cat-swatch w-5 h-5 rounded-full bg-[#8B5CF6] border-2 border-white dark:border-dark-card shadow-sm hover:scale-110 transition-transform cursor-pointer" title="Morado"></button>
        <button type="button" onclick="selectCategoryColorSwatch('pastel-indigo')" class="cat-swatch w-5 h-5 rounded-full bg-[#6366F1] border-2 border-white dark:border-dark-card shadow-sm hover:scale-110 transition-transform cursor-pointer" title="Índigo"></button>
        <button type="button" onclick="selectCategoryColorSwatch('pastel-rose')" class="cat-swatch w-5 h-5 rounded-full bg-[#FB7185] border-2 border-white dark:border-dark-card shadow-sm hover:scale-110 transition-transform cursor-pointer" title="Rosa Palo"></button>
      </div>

      <div class="flex gap-2">
        <button id="cat-form-submit" onclick="saveCategoryFormAction()"
          class="flex-1 py-2.5 bg-pastel-pink-300 hover:bg-pastel-pink-400 text-white rounded-xl text-xs font-title font-bold shadow-sm hover:shadow transition-all cursor-pointer">
          + Agregar Materia
        </button>
        <button id="cat-form-cancel" type="button" onclick="cancelCategoryEdit()"
          class="hidden px-4 py-2.5 rounded-xl border border-slate-200 dark:border-dark-border text-slate-500 hover:bg-slate-100 dark:hover:bg-dark-hover text-xs font-semibold transition-colors cursor-pointer">
          Cancelar
        </button>
      </div>
    </div>

    <!-- Categories Manage List (rendered dynamically by app.js) -->
    <div class="flex flex-col gap-2.5">
      <h4 class="text-xs font-bold text-slate-400 dark:text-slate-500 uppercase tracking-wide">Materias Existentes</h4>
      <div id="manage-categories-list" class="flex flex-col gap-2 max-h-56 overflow-y-auto pr-1">
        <!-- JS Rendered with Edit & Delete icons -->
      </div>
    </div>

    <div class="flex justify-end pt-1">
      <button onclick="closeManageCategories()"
        class="px-5 py-2.5 bg-slate-100 hover:bg-slate-200 dark:bg-dark-hover dark:hover:bg-dark-border text-slate-700 dark:text-slate-200 rounded-xl text-xs font-bold transition-all cursor-pointer">
        Cerrar
      </button>
    </div>
  </div>
</div>
