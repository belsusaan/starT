<!-- ==========================================
     COMPONENT: MANAGE CATEGORIES MODAL
     Modal dialog to add/edit categories with name input,
     12 color swatch pickers, existing categories list with edit/delete icons.
     ========================================== -->
<div id="categories-modal"
  class="fixed inset-0 z-50 hidden items-center justify-center p-4 bg-slate-900/40 dark:bg-black/60 backdrop-blur-sm transition-all duration-300"
  role="dialog" aria-labelledby="categories-modal-title" aria-modal="true"
  onclick="handleCategoriesModalBackdropClick(event)">
  <div
    class="bg-white dark:bg-dark-card rounded-[32px] p-6 sm:p-8 w-full max-w-lg md:max-w-3xl lg:max-w-4xl max-h-[90vh] overflow-y-auto shadow-2xl border border-slate-100 dark:border-dark-border transform transition-all flex flex-col gap-6 animate-task-appear scrollbar-none"
    onclick="event.stopPropagation()">
    <!-- Header -->
    <div class="flex items-center justify-between pb-1">
      <h3 id="categories-modal-title" class="font-title text-3xl sm:text-4xl font-bold text-[#1E3A56] dark:text-slate-50 leading-none">Gestionar Materias</h3>
      <button onclick="closeManageCategories()"
        class="p-2 text-slate-400 hover:text-slate-600 dark:hover:text-slate-200 rounded-2xl hover:bg-slate-100 dark:hover:bg-dark-hover transition-colors cursor-pointer"
        title="Cerrar">
        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2.5" stroke="currentColor"
          class="w-7 h-7">
          <path stroke-linecap="round" stroke-linejoin="round" d="M6 18 18 6M6 6l12 12" />
        </svg>
      </button>
    </div>

    <!-- Responsive Layout: 2 columns on desktop, 1 column on mobile -->
    <div class="grid grid-cols-1 md:grid-cols-2 gap-6 items-start">
      <!-- Left Column: Add / Edit Category Form -->
      <div class="flex flex-col gap-4 p-5 bg-slate-50/80 dark:bg-dark-hover/60 rounded-3xl border border-slate-100 dark:border-dark-border">
        <input type="hidden" id="new-cat-color" value="pastel-pink">
        <div class="flex flex-col gap-1.5">
          <label for="cat-name-input" id="cat-form-legend"
            class="text-2xl sm:text-3xl font-title font-bold text-[#1E3A56] dark:text-slate-200 tracking-wide pl-1">Nueva Materia</label>
          <div class="bg-white dark:bg-dark-card rounded-2xl px-4 py-2.5 border border-slate-200 dark:border-dark-border focus-within:border-[#CE1483] transition-all">
            <input type="text" id="cat-name-input" placeholder="Nombre de la materia..."
              class="w-full bg-transparent text-2xl sm:text-3xl font-sans font-medium text-[#1E3A56] dark:text-slate-100 placeholder:text-2xl sm:placeholder:text-3xl placeholder-slate-400 focus:outline-none leading-none pt-0.5">
          </div>
        </div>

        <!-- Color Circle Swatches for instant visual picking -->
        <div class="flex flex-col gap-2">
          <span class="text-xl sm:text-2xl font-title font-bold text-[#1E3A56] dark:text-slate-300 pl-1 leading-none">Color de la materia</span>
          <div class="flex items-center gap-2 flex-wrap" id="cat-swatches-container">
            <button type="button" onclick="selectCategoryColorSwatch('pastel-pink')" class="cat-swatch w-7 h-7 rounded-full bg-[#CE1483] border-2 border-white dark:border-dark-card shadow-sm hover:scale-110 transition-transform cursor-pointer" title="Rosa Fuerte (Magenta)"></button>
            <button type="button" onclick="selectCategoryColorSwatch('pastel-blue')" class="cat-swatch w-7 h-7 rounded-full bg-[#33658A] border-2 border-white dark:border-dark-card shadow-sm hover:scale-110 transition-transform cursor-pointer" title="Baltic Blue"></button>
            <button type="button" onclick="selectCategoryColorSwatch('pastel-yellow')" class="cat-swatch w-7 h-7 rounded-full bg-[#F5F2B8] border-2 border-white dark:border-dark-card shadow-sm hover:scale-110 transition-transform cursor-pointer" title="Lemon Chiffon"></button>
            <button type="button" onclick="selectCategoryColorSwatch('pastel-mint')" class="cat-swatch w-7 h-7 rounded-full bg-[#FCD3DE] border-2 border-white dark:border-dark-card shadow-sm hover:scale-110 transition-transform cursor-pointer" title="Rosa Pálido"></button>
            <button type="button" onclick="selectCategoryColorSwatch('pastel-rose')" class="cat-swatch w-7 h-7 rounded-full bg-[#FB7185] border-2 border-white dark:border-dark-card shadow-sm hover:scale-110 transition-transform cursor-pointer" title="Rosa Vivo"></button>
            <button type="button" onclick="selectCategoryColorSwatch('pastel-coral')" class="cat-swatch w-7 h-7 rounded-full bg-[#F472B6] border-2 border-white dark:border-dark-card shadow-sm hover:scale-110 transition-transform cursor-pointer" title="Rosa Pastel"></button>
            <button type="button" onclick="selectCategoryColorSwatch('pastel-indigo')" class="cat-swatch w-7 h-7 rounded-full bg-[#4682B4] border-2 border-white dark:border-dark-card shadow-sm hover:scale-110 transition-transform cursor-pointer" title="Azul Acero"></button>
            <button type="button" onclick="selectCategoryColorSwatch('pastel-teal')" class="cat-swatch w-7 h-7 rounded-full bg-[#234A68] border-2 border-white dark:border-dark-card shadow-sm hover:scale-110 transition-transform cursor-pointer" title="Azul Profundo"></button>
            <button type="button" onclick="selectCategoryColorSwatch('pastel-peach')" class="cat-swatch w-7 h-7 rounded-full bg-[#F79F67] border-2 border-white dark:border-dark-card shadow-sm hover:scale-110 transition-transform cursor-pointer" title="Durazno Suave"></button>
            <button type="button" onclick="selectCategoryColorSwatch('pastel-lavender')" class="cat-swatch w-7 h-7 rounded-full bg-[#8B5CF6] border-2 border-white dark:border-dark-card shadow-sm hover:scale-110 transition-transform cursor-pointer" title="Lavanda"></button>
            <button type="button" onclick="selectCategoryColorSwatch('pastel-purple')" class="cat-swatch w-7 h-7 rounded-full bg-[#7C3AED] border-2 border-white dark:border-dark-card shadow-sm hover:scale-110 transition-transform cursor-pointer" title="Morado"></button>
            <button type="button" onclick="selectCategoryColorSwatch('pastel-emerald')" class="cat-swatch w-7 h-7 rounded-full bg-[#9D174D] border-2 border-white dark:border-dark-card shadow-sm hover:scale-110 transition-transform cursor-pointer" title="Vino Magenta"></button>
          </div>
        </div>

        <div class="flex gap-2.5 pt-1">
          <button id="cat-form-submit" onclick="saveCategoryFormAction()"
            class="flex-1 py-3 bg-[#CE1483] hover:bg-[#B0106E] active:scale-[0.99] text-white rounded-full text-2xl sm:text-3xl font-title font-bold shadow-md hover:shadow-lg transition-all cursor-pointer leading-none">
            + Agregar Materia
          </button>
          <button id="cat-form-cancel" type="button" onclick="cancelCategoryEdit()"
            class="hidden px-5 py-3 rounded-full border border-slate-200 dark:border-dark-border text-slate-500 hover:bg-slate-100 dark:hover:bg-dark-hover text-2xl font-title font-bold transition-colors cursor-pointer leading-none">
            Descartar
          </button>
        </div>
      </div>

      <!-- Right Column: Existing Categories List -->
      <div class="flex flex-col gap-3">
        <h4 class="text-2xl sm:text-3xl font-title font-bold text-[#1E3A56] dark:text-slate-200 tracking-wide pl-1">Materias Existentes</h4>
        <div id="manage-categories-list" class="flex flex-col gap-2 max-h-64 md:max-h-76 overflow-y-auto pr-1">
          <!-- JS Rendered with Edit & Delete icons -->
        </div>
      </div>
    </div>
  </div>
</div>
