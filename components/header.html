<!-- ==========================================
     COMPONENT: MAIN APPLICATION HEADER
     Sticky header containing brand logo, app title,
     theme palette selector, user account/sync button,
     PWA install button, and dark mode toggle.
     ========================================== -->
<header
  class="w-full bg-white/80 dark:bg-dark-card/85 backdrop-blur-md sticky top-0 z-30 border-b border-pastel-pink-100/50 dark:border-dark-border px-4 py-3 shadow-sm max-w-2xl mx-auto md:rounded-b-2xl md:mt-2 transition-colors duration-300">
  <div class="flex items-center justify-between gap-3">
    <!-- Brand Title & Logo -->
    <div class="flex items-center gap-3">
      <div
        class="w-11 h-11 rounded-2xl overflow-hidden shadow-sm border-2 border-white dark:border-dark-border hover:scale-105 active:scale-95 transition-transform duration-200 flex items-center justify-center p-1 bg-white/80 dark:bg-dark-card/70 shrink-0">
        <img src="assets/images/logo.svg" alt="StarT Logo" class="w-full h-full object-contain">
      </div>
      <div>
        <h1 id="app-title"
          class="font-title text-xl font-bold tracking-tight text-slate-800 dark:text-slate-50 flex items-center gap-1.5">
          StarT
        </h1>
        <p class="text-[10px] text-slate-400 dark:text-slate-500 -mt-1 font-sans">Tareitas pendientes</p>
      </div>
    </div>

    <!-- Right Side Actions & Settings -->
    <div class="flex items-center gap-2">
      <!-- Palette Theme Selector Dropdown -->
      <div class="relative" id="palette-dropdown-wrapper">
        <button id="palette-dropdown-btn" type="button" onclick="togglePaletteDropdown(event)"
          class="flex items-center gap-1.5 px-2.5 py-1.5 rounded-full text-xs font-title font-bold bg-white dark:bg-dark-card border border-slate-200 dark:border-dark-border hover:border-pastel-pink-300 dark:hover:border-pastel-pink-400 text-slate-700 dark:text-slate-200 transition-all duration-200 cursor-pointer shadow-xs select-none"
          title="Elegir tema de color" aria-haspopup="true" aria-expanded="false">
          <span id="palette-btn-icon" class="flex items-center -space-x-1">
            <span class="w-2.5 h-2.5 rounded-full bg-pastel-pink-400"></span>
            <span class="w-2.5 h-2.5 rounded-full bg-pastel-pink-200 border border-white dark:border-dark-card"></span>
          </span>
          <span id="current-palette-name" class="hidden sm:inline text-[11px] font-semibold">Rosa Clásico</span>
          <svg id="palette-dropdown-chevron" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2.5" stroke="currentColor" class="w-3 h-3 text-slate-400 transition-transform duration-200">
            <path stroke-linecap="round" stroke-linejoin="round" d="m19.5 8.25-7.5 7.5-7.5-7.5" />
          </svg>
        </button>

        <!-- Dropdown Menu (rendered dynamically by app.js) -->
        <div id="palette-dropdown-menu"
          class="hidden absolute right-0 mt-2 w-56 bg-white dark:bg-dark-card rounded-2xl shadow-xl border border-slate-100 dark:border-dark-border p-1.5 z-50 flex-col gap-1 animate-task-appear">
          <!-- Rendered by renderPaletteDropdown() in app.js -->
        </div>
      </div>

      <!-- User Account / Sync Button -->
      <button id="auth-btn" onclick="openProfileModal()"
        class="flex items-center gap-1.5 px-3 py-1.5 rounded-full text-xs font-title bg-pastel-pink-100 hover:bg-pastel-pink-200 dark:bg-dark-hover dark:hover:bg-dark-border text-pastel-pink-500 dark:text-pastel-pink-300 border border-pastel-pink-200/60 dark:border-dark-border transition-all duration-200 cursor-pointer"
        title="Cuenta de usuario y sincronización">
        <span id="user-avatar-icon" class="flex items-center justify-center">
          <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2"
            stroke="currentColor" class="w-4 h-4">
            <path stroke-linecap="round" stroke-linejoin="round"
              d="M15.75 6a3.75 3.75 0 1 1-7.5 0 3.75 3.75 0 0 1 7.5 0ZM4.501 20.118a7.5 7.5 0 0 1 14.998 0A17.933 17.933 0 0 1 12 21.75c-2.676 0-5.216-.584-7.499-1.632Z" />
          </svg>
        </span>
        <span id="user-display-name" class="font-bold max-w-[100px] sm:max-w-[130px] truncate">Susana</span>
      </button>

      <!-- Install App Button (Visible if PWA install is ready) -->
      <button id="install-btn"
        class="hidden items-center gap-1.5 px-3 py-1.5 rounded-full text-xs font-title bg-pastel-pink-300 hover:bg-pastel-pink-400 text-white shadow-sm hover:shadow transition-all duration-200 cursor-pointer"
        title="Instalar aplicación en tu móvil">
        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2"
          stroke="currentColor" class="w-4 h-4">
          <path stroke-linecap="round" stroke-linejoin="round"
            d="M3 16.5v2.25A2.25 2.25 0 0 0 5.25 21h13.5A2.25 2.25 0 0 0 21 18.75V16.5M16.5 12 12 16.5m0 0L7.5 12m4.5 4.5V3" />
        </svg>
        <span class="hidden sm:inline">Instalar</span>
      </button>

      <!-- Dark Mode Toggle -->
      <button id="theme-toggle"
        class="p-2 rounded-full border border-slate-100 dark:border-dark-border hover:bg-slate-50 dark:hover:bg-dark-hover transition-colors duration-200 cursor-pointer"
        title="Cambiar Modo Claro/Oscuro">
        <span id="theme-toggle-icon">
          <!-- Rendered by JS -->
        </span>
      </button>
    </div>
  </div>
</header>
