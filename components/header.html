<!-- ==========================================
     COMPONENT: MAIN APPLICATION HEADER
     Mockup Figma: Hamburger on left (Settings),
     greeting "Hey, [Nombre]", subtitle, and avatar on right
     which opens user profile & password change modal.
     ========================================== -->
<header
  class="w-full bg-white dark:bg-dark-card border-b border-slate-100 dark:border-dark-border sticky top-0 z-30 transition-colors duration-300">
  <div class="w-full max-w-2xl md:max-w-5xl lg:max-w-6xl mx-auto px-4 sm:px-6 lg:px-8 py-3 sm:py-4 flex items-center justify-between gap-3">
    <!-- Botón Configuración (Hamburguesa izquierda) -->
    <button onclick="openSettingsModal()"
      class="p-2 rounded-2xl hover:bg-slate-100 dark:hover:bg-dark-hover text-[#1E3A56] dark:text-slate-100 transition-colors cursor-pointer select-none"
      title="Configuración de materias, tema y app">
      <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2.4" stroke="currentColor"
        class="w-6 h-6 sm:w-7 sm:h-7">
        <path stroke-linecap="round" stroke-linejoin="round" d="M3.75 6.75h16.5M3.75 12h16.5m-16.5 5.25h16.5" />
      </svg>
    </button>

    <!-- Centro / Derecha: Botón Crear Tarea en Desktop + Saludo y Avatar -->
    <div class="flex items-center gap-4 sm:gap-6">
      <button onclick="openAddModal()"
        class="hidden md:flex items-center gap-2 px-5 py-2 sm:py-2.5 rounded-full bg-[#CE1483] hover:bg-[#B0106E] text-white text-xl sm:text-2xl font-title font-bold border-2 border-[#CE1483] shadow-xs hover:shadow transition-all cursor-pointer select-none leading-none">
        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2.5" stroke="currentColor" class="w-5 h-5">
          <path stroke-linecap="round" stroke-linejoin="round" d="M12 4.5v15m7.5-7.5h-15" />
        </svg>
        <span>Nueva Tarea</span>
      </button>

      <!-- Saludo "Hey, name" + Subtítulo + Avatar Circular (Abre Perfil y Contraseña) -->
      <div onclick="openProfileModal()" class="flex items-center gap-3 cursor-pointer select-none group"
      title="Ver perfil y cambiar contraseña">
      <div class="flex flex-col text-right">
        <span class="font-title text-2xl sm:text-3xl font-bold text-[#1E3A56] dark:text-slate-100 leading-none">
          Hey, <span id="user-display-name">name</span>
        </span>
        <span class="font-sans text-lg sm:text-xl text-slate-400 dark:text-slate-400 leading-none pt-0.5">
          Tus tareitas pendientes
        </span>
      </div>
      <div id="user-avatar-icon"
        class="w-11 h-11 rounded-full bg-[#D1D5DB] dark:bg-slate-700 text-[#1E3A56] dark:text-slate-100 flex items-center justify-center font-title text-lg font-bold shadow-xs border-2 border-white dark:border-dark-border group-hover:scale-105 transition-transform overflow-hidden shrink-0">
        U
      </div>
    </div>
  </div>
</header>
