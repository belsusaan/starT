<!-- ==========================================
     COMPONENT: AUTH & LOGIN GATEWAY SCREEN
     Initial screen shown when user is not logged in.
     Contains branding, tabs, login/register forms, and guest mode option.
     ========================================== -->
<div id="auth-gateway-screen"
  class="flex-1 flex flex-col items-center justify-center p-4 min-h-screen animate-fade-in max-w-md mx-auto w-full">
  <div
    class="bg-white dark:bg-dark-card rounded-3xl p-6 sm:p-8 w-full shadow-2xl border border-slate-100 dark:border-dark-border transform transition-all flex flex-col gap-6 animate-task-appear">

    <!-- Gateway Branding -->
    <div class="flex flex-col items-center text-center gap-3">
      <div
        class="w-16 h-16 rounded-3xl overflow-hidden shadow-md border-2 border-white dark:border-dark-border flex items-center justify-center p-2 bg-pastel-pink-50 dark:bg-dark-hover shrink-0 animate-float">
        <img src="assets/images/logo.svg" alt="StarT Logo" class="w-full h-full object-contain">
      </div>
      <div>
        <h1 class="font-title text-2xl font-bold tracking-tight text-slate-800 dark:text-slate-50">
          StarT
        </h1>
        <p class="text-xs text-slate-400 dark:text-slate-500 mt-0.5 font-sans">Organiza tus materias y tareitas pendientes</p>
      </div>
    </div>

    <!-- Auth Tabs -->
    <div class="flex rounded-2xl bg-slate-100 dark:bg-dark-hover p-1 gap-1">
      <button id="gate-tab-login" onclick="switchAuthTab('login')"
        class="flex-1 py-2 rounded-xl text-xs font-title font-bold transition-all duration-200 bg-white dark:bg-dark-card text-pastel-pink-500 dark:text-pastel-pink-300 shadow-sm cursor-pointer">
        Iniciar Sesión
      </button>
      <button id="gate-tab-register" onclick="switchAuthTab('register')"
        class="flex-1 py-2 rounded-xl text-xs font-title font-bold transition-all duration-200 text-slate-500 dark:text-slate-400 hover:text-slate-700 dark:hover:text-slate-200 cursor-pointer">
        Crear Cuenta
      </button>
    </div>

    <!-- Error / Notification Alert -->
    <div id="auth-alert" class="hidden p-3.5 rounded-2xl text-xs font-medium transition-all"></div>

    <!-- Form Inputs -->
    <form id="auth-form" onsubmit="handleAuthSubmit(event)" class="flex flex-col gap-3.5">
      <!-- Name (Visible only on Register) -->
      <div id="auth-name-group" class="hidden flex flex-col gap-1">
        <label for="auth-name"
          class="text-xs font-semibold text-slate-400 dark:text-slate-500 uppercase tracking-wider">Tu Nombre</label>
        <input type="text" id="auth-name" placeholder="Ej. Susana"
          class="w-full px-3.5 py-2.5 rounded-xl border border-slate-200 dark:border-dark-border bg-slate-50 dark:bg-dark-card text-sm text-slate-700 dark:text-slate-200 focus:outline-none focus:border-pastel-pink-300 font-sans">
      </div>

      <!-- Email -->
      <div id="auth-email-group" class="flex flex-col gap-1">
        <label for="auth-email"
          class="text-xs font-semibold text-slate-400 dark:text-slate-500 uppercase tracking-wider">Correo Electrónico</label>
        <input type="email" id="auth-email" required placeholder="tucorreo@ejemplo.com"
          class="w-full px-3.5 py-2.5 rounded-xl border border-slate-200 dark:border-dark-border bg-slate-50 dark:bg-dark-card text-sm text-slate-700 dark:text-slate-200 focus:outline-none focus:border-pastel-pink-300 font-sans">
      </div>

      <!-- Password -->
      <div id="auth-password-group" class="flex flex-col gap-1">
        <label for="auth-password"
          class="text-xs font-semibold text-slate-400 dark:text-slate-500 uppercase tracking-wider">Contraseña</label>
        <div class="relative flex items-center">
          <input type="password" id="auth-password" required minlength="6" placeholder="Mínimo 6 caracteres"
            class="w-full px-3.5 py-2.5 rounded-xl border border-slate-200 dark:border-dark-border bg-slate-50 dark:bg-dark-card text-sm text-slate-700 dark:text-slate-200 focus:outline-none focus:border-pastel-pink-300 font-sans pr-10">
          <button type="button" onclick="togglePasswordVisibility()"
            class="absolute right-3 text-slate-400 hover:text-slate-600 dark:hover:text-slate-200 cursor-pointer">
            <svg id="eye-icon" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5"
              stroke="currentColor" class="w-4 h-4">
              <path stroke-linecap="round" stroke-linejoin="round"
                d="M2.036 12.322a1.012 1.012 0 0 1 0-.639C3.423 7.51 7.36 4.5 12 4.5c4.638 0 8.573 3.007 9.963 7.178.07.207.07.431 0 .639C20.577 16.49 16.64 19.5 12 19.5c-4.638 0-8.573-3.007-9.963-7.178Z" />
              <path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 1 1-6 0 3 3 0 0 1 6 0Z" />
            </svg>
          </button>
        </div>
      </div>

      <!-- Submit Button -->
      <button type="submit" id="auth-submit-btn"
        class="w-full py-3 mt-2 rounded-2xl text-sm font-title font-bold bg-pastel-pink-300 hover:bg-pastel-pink-400 text-white shadow-md hover:shadow-lg transition-all cursor-pointer flex items-center justify-center gap-2">
        <span>Iniciar Sesión</span>
      </button>
    </form>

    <!-- Local Guest Option -->
    <div class="flex flex-col gap-2.5 pt-2 border-t border-slate-100 dark:border-dark-border text-center">
      <button type="button" onclick="continueAsGuest()"
        class="w-full py-2.5 px-4 rounded-xl border border-slate-200 dark:border-dark-border bg-slate-50 dark:bg-dark-hover hover:bg-slate-100 text-xs text-slate-600 dark:text-slate-300 font-title font-semibold transition-colors cursor-pointer flex items-center justify-center gap-2">
        <span>Entrar en Modo Local (Sin cuenta)</span>
      </button>
    </div>

  </div>
</div>
