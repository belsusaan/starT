<!-- ==========================================
     COMPONENT: SETTINGS / CONFIGURATION MODAL
     Opened by the top-left hamburger icon.
     Allows managing subjects/categories, color palettes,
     dark mode toggle, and PWA installation.
     ========================================== -->
<div id="settings-modal"
  class="fixed inset-0 z-50 hidden items-center justify-center p-4 bg-slate-900/40 backdrop-blur-sm animate-fade-in"
  role="dialog" aria-labelledby="settings-modal-title" aria-modal="true">
  <div
    class="bg-white dark:bg-dark-card rounded-3xl p-6 w-full max-w-md shadow-2xl border border-slate-100 dark:border-dark-border transform transition-all flex flex-col gap-5 animate-task-appear max-h-[90vh] overflow-y-auto">

    <!-- Header -->
    <div class="flex items-center justify-between">
      <div class="flex items-center gap-2.5">
        <div class="w-8 h-8 rounded-xl bg-[#33658A]/10 text-[#33658A] flex items-center justify-center">
          <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" class="w-5 h-5">
            <path stroke-linecap="round" stroke-linejoin="round" d="M10.5 6h9.75M10.5 6a1.5 1.5 0 1 1-3 0m3 0a1.5 1.5 0 1 0-3 0M3.75 6H7.5m3 12h9.75m-9.75 0a1.5 1.5 0 0 1-3 0m3 0a1.5 1.5 0 0 0-3 0m-3.75 0H7.5m9-6h3.75m-3.75 0a1.5 1.5 0 0 1-3 0m3 0a1.5 1.5 0 0 0-3 0m-9.75 0h9.75" />
          </svg>
        </div>
        <h3 id="settings-modal-title" class="font-title text-xl font-bold text-slate-800 dark:text-slate-50">Configuración</h3>
      </div>
      <button onclick="closeSettingsModal()"
        class="p-1 text-slate-400 hover:text-slate-600 dark:hover:text-slate-200 rounded-lg cursor-pointer">
        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" class="w-5 h-5">
          <path stroke-linecap="round" stroke-linejoin="round" d="M6 18 18 6M6 6l12 12" />
        </svg>
      </button>
    </div>

    <!-- Option: Gestionar Materias y Colores -->
    <div class="p-4 rounded-2xl bg-slate-50 dark:bg-dark-hover border border-slate-100 dark:border-dark-border flex items-center justify-between gap-3">
      <div>
        <h4 class="font-title text-base font-bold text-slate-800 dark:text-slate-100">Gestionar Materias</h4>
        <p class="font-sans text-base text-slate-500 dark:text-slate-400">Agrega materias y personaliza sus colores</p>
      </div>
      <button onclick="closeSettingsModal(); openManageCategories()"
        class="px-4 py-2 rounded-xl bg-[#33658A] hover:bg-[#234A68] text-white text-xs font-title font-bold transition-all shadow-xs cursor-pointer shrink-0">
        Abrir
      </button>
    </div>

    <!-- Option: Modo Oscuro -->
    <div class="p-4 rounded-2xl bg-slate-50 dark:bg-dark-hover border border-slate-100 dark:border-dark-border flex items-center justify-between gap-3">
      <div>
        <h4 class="font-title text-base font-bold text-slate-800 dark:text-slate-100">Modo Oscuro</h4>
        <p class="font-sans text-base text-slate-500 dark:text-slate-400">Alternar tema claro y oscuro</p>
      </div>
      <button onclick="toggleTheme()" class="p-2.5 rounded-xl bg-white dark:bg-dark-card border border-slate-200 dark:border-dark-border text-slate-700 dark:text-slate-200 hover:border-[#33658A] cursor-pointer transition-all">
        <svg id="theme-toggle-icon-settings" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" class="w-5 h-5">
          <path stroke-linecap="round" stroke-linejoin="round" d="M21.752 15.002A9.72 9.72 0 0 1 18 15.75c-5.385 0-9.75-4.365-9.75-9.75 0-1.33.266-2.597.748-3.752A9.753 9.753 0 0 0 3 11.25C3 16.635 7.365 21 12.75 21a9.753 9.753 0 0 0 9.002-5.998Z" />
        </svg>
      </button>
    </div>

    <!-- Option: Instalar App (PWA) -->
    <div id="settings-install-wrapper" class="hidden p-4 rounded-2xl bg-slate-50 dark:bg-dark-hover border border-slate-100 dark:border-dark-border flex items-center justify-between gap-3">
      <div>
        <h4 class="font-title text-base font-bold text-slate-800 dark:text-slate-100">Instalar en Dispositivo</h4>
        <p class="font-sans text-base text-slate-500 dark:text-slate-400">Instala StarT como aplicación en tu celular o PC</p>
      </div>
      <button onclick="triggerPWAInstall()"
        class="px-4 py-2 rounded-xl bg-[#33658A] hover:bg-[#234A68] text-white text-xs font-title font-bold transition-all shadow-xs cursor-pointer shrink-0">
        Instalar
      </button>
    </div>

    <!-- Close button -->
    <div class="flex justify-end pt-1">
      <button onclick="closeSettingsModal()"
        class="px-5 py-2.5 bg-slate-100 hover:bg-slate-200 dark:bg-dark-hover dark:hover:bg-dark-border text-slate-700 dark:text-slate-200 rounded-xl text-xs font-title font-bold transition-all cursor-pointer">
        Cerrar
      </button>
    </div>
  </div>
</div>
