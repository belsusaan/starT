<!-- ==========================================
     COMPONENT: MOBILE FLOATING ADD BUTTON (FAB)
     Fixed action button displayed on mobile viewports
     to quickly create a new task.
     ========================================== -->
<button onclick="openAddModal()"
  class="md:hidden fixed bottom-6 right-6 w-14 h-14 rounded-full bg-gradient-to-tr from-pastel-pink-400 to-pastel-pink-300 hover:from-pastel-pink-500 hover:to-pastel-pink-400 text-white shadow-lg hover:shadow-xl active:scale-95 transition-all duration-200 flex items-center justify-center z-40 cursor-pointer"
  id="mobile-fab" title="Agregar Nueva Tarea" aria-label="Agregar Nueva Tarea">
  <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="3" stroke="currentColor"
    class="w-6 h-6">
    <path stroke-linecap="round" stroke-linejoin="round" d="M12 4.5v15m7.5-7.5h-15" />
  </svg>
</button>
