<!-- ==========================================
     COMPONENT: MOBILE FLOATING ADD BUTTON (FAB)
     Fixed action button displayed on mobile viewports
     to quickly create a new task.
     ========================================== -->
<button onclick="openAddModal()"
  class="fixed bottom-6 right-6 sm:bottom-8 sm:right-8 w-14 h-14 sm:w-16 sm:h-16 rounded-full bg-gradient-to-tr from-[#CE1483] to-[#B0106E] hover:from-[#B0106E] hover:to-[#8E0B57] text-white shadow-xl hover:shadow-2xl hover:scale-105 active:scale-95 transition-all duration-200 flex items-center justify-center z-40 cursor-pointer"
  id="mobile-fab" title="Agregar Nueva Tarea" aria-label="Agregar Nueva Tarea">
  <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="3" stroke="currentColor"
    class="w-6 h-6">
    <path stroke-linecap="round" stroke-linejoin="round" d="M12 4.5v15m7.5-7.5h-15" />
  </svg>
</button>
