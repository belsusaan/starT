<!-- ==========================================
     COMPONENT: ADD / EDIT TASK MODAL
     Modal dialog with title input, description textarea,
     category dropdown, star priority toggle, and delete/save actions.
     ========================================== -->
<div id="task-modal"
  class="fixed inset-0 z-50 hidden items-center justify-center p-4 bg-slate-900/40 dark:bg-black/60 backdrop-blur-sm transition-all duration-300"
  role="dialog" aria-labelledby="modal-title" aria-modal="true">
  <div
    class="bg-white dark:bg-dark-card rounded-3xl p-6 w-full max-w-md shadow-2xl border border-slate-100 dark:border-dark-border transform transition-all flex flex-col gap-5 animate-task-appear">
    <!-- Header -->
    <div class="flex items-center justify-between">
      <h3 id="modal-title" class="font-title text-lg font-bold text-slate-800 dark:text-slate-50">Nueva Tarea</h3>
      <button onclick="closeModal()"
        class="p-1 text-slate-400 hover:text-slate-600 dark:hover:text-slate-200 rounded-lg cursor-pointer">
        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor"
          class="w-5 h-5">
          <path stroke-linecap="round" stroke-linejoin="round" d="M6 18 18 6M6 6l12 12" />
        </svg>
      </button>
    </div>

    <!-- Form Inputs -->
    <div class="flex flex-col gap-4">
      <!-- Title -->
      <div class="flex flex-col gap-1">
        <label for="task-title"
          class="text-xs font-semibold text-slate-400 dark:text-slate-500 uppercase tracking-wider">Título de la tarea</label>
        <input type="text" id="task-title" placeholder="Ej. Estudiar funciones trigonométricas"
          class="w-full px-4 py-2.5 rounded-xl border border-slate-200 dark:border-dark-border bg-slate-50 dark:bg-dark-card text-sm text-slate-700 dark:text-slate-200 focus:outline-none focus:border-pastel-pink-300 focus:ring-1 focus:ring-pastel-pink-300 transition-colors font-sans">
      </div>

      <!-- Description -->
      <div class="flex flex-col gap-1">
        <label for="task-desc"
          class="text-xs font-semibold text-slate-400 dark:text-slate-500 uppercase tracking-wider">Descripción (Opcional)</label>
        <textarea id="task-desc" rows="2" placeholder="Detalles sobre entregables, temas, apuntes..."
          class="w-full px-4 py-2.5 rounded-xl border border-slate-200 dark:border-dark-border bg-slate-50 dark:bg-dark-card text-sm text-slate-700 dark:text-slate-200 focus:outline-none focus:border-pastel-pink-300 focus:ring-1 focus:ring-pastel-pink-300 transition-colors font-sans resize-none"></textarea>
      </div>

      <!-- Category & Priority Row -->
      <div class="grid grid-cols-2 gap-4">
        <div class="flex flex-col gap-1">
          <label for="task-category"
            class="text-xs font-semibold text-slate-400 dark:text-slate-500 uppercase tracking-wider">Materia</label>
          <select id="task-category"
            class="w-full px-3 py-2.5 rounded-xl border border-slate-200 dark:border-dark-border bg-slate-50 dark:bg-dark-card text-sm text-slate-700 dark:text-slate-200 focus:outline-none focus:border-pastel-pink-300 transition-colors font-sans cursor-pointer">
          </select>
        </div>

        <div class="flex flex-col gap-1 items-center justify-center">
          <span class="text-xs font-semibold text-slate-400 dark:text-slate-500 uppercase tracking-wider mb-1">Prioridad</span>
          <button type="button" id="task-priority-toggle" onclick="toggleModalPriority()"
            class="focus:outline-none cursor-pointer" data-priority="false">
          </button>
        </div>
      </div>
    </div>

    <!-- Actions -->
    <div class="flex items-center justify-between gap-3 pt-2">
      <button type="button" id="btn-modal-delete-task" onclick="deleteEditingTask()"
        class="hidden px-4 py-2.5 rounded-xl text-sm font-semibold text-red-500 hover:bg-red-50 dark:hover:bg-red-950/30 transition-colors cursor-pointer flex items-center gap-1.5">
        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.8"
          stroke="currentColor" class="w-4 h-4">
          <path stroke-linecap="round" stroke-linejoin="round"
            d="m14.74 9-.346 9m-4.788 0L9.26 9m9.968-3.21c.342.052.682.107 1.022.166m-1.022-.165L18.16 19.673a2.25 2.25 0 0 1-2.244 2.077H8.084a2.25 2.25 0 0 1-2.244-2.077L4.772 5.79m14.456 0a48.108 48.108 0 0 0-3.478-.397m-12 .562c.34-.059.68-.114 1.022-.165m0 0a48.11 48.11 0 0 1 3.478-.397m7.5 0v-.916c0-1.18-.91-2.164-2.09-2.201a51.964 51.964 0 0 0-3.32 0c-1.18.037-2.09 1.022-2.09 2.201v.916m7.5 0a48.667 48.667 0 0 0-7.5 0" />
        </svg>
        <span>Eliminar</span>
      </button>
      <div class="flex items-center gap-2 ml-auto">
        <button type="button" onclick="closeModal()"
          class="px-4 py-2.5 rounded-xl text-sm font-semibold text-slate-500 hover:bg-slate-50 dark:hover:bg-dark-hover transition-colors cursor-pointer">
          Cancelar
        </button>
        <button type="button" onclick="saveTaskAction()"
          class="px-5 py-2.5 rounded-xl text-sm font-semibold bg-pastel-pink-300 hover:bg-pastel-pink-400 text-white shadow-sm hover:shadow transition-all cursor-pointer font-title">
          Guardar Tarea
        </button>
      </div>
    </div>
  </div>
</div>
