<!-- ==========================================
     COMPONENT: WELCOME & STATS BANNER
     Mockup Figma: Fondo amarillo Lemon Chiffon #F5F2B8,
     contador de tareas pendientes/totales, frase motivacional
     y círculo de porcentaje rosa #FCD3DE con aro de progreso #CE1483.
     ========================================== -->
<section
  class="w-full bg-[#F5F2B8] text-[#1E3A56] rounded-[36px] p-6 sm:p-7 flex items-center justify-between gap-4 shadow-sm relative overflow-hidden">
  <div class="flex-1 min-w-0 pr-2">
    <h2 id="banner-tasks-count" class="font-cherry text-3xl sm:text-4xl text-[#1E3A56] leading-none mb-1">
      0/0 tareas
    </h2>
    <p id="banner-quote" class="font-sans text-xl sm:text-2xl text-[#1E3A56]/90 font-medium leading-tight">
      Keep going, only fools are satisfied
    </p>
  </div>

  <!-- Círculo de porcentaje rosa con aro de progreso circular -->
  <div class="relative w-20 h-20 sm:w-24 sm:h-24 rounded-full bg-[#FCD3DE] flex items-center justify-center shrink-0 shadow-inner">
    <svg class="absolute inset-0 w-full h-full -rotate-90" viewBox="0 0 80 80">
      <circle cx="40" cy="40" r="34" stroke="transparent" stroke-width="4.5" fill="none" />
      <circle id="banner-progress-circle" cx="40" cy="40" r="34" stroke="#CE1483" stroke-width="4.5" fill="none"
        stroke-linecap="round" stroke-dasharray="213.6" stroke-dashoffset="213.6"
        class="transition-all duration-700 ease-out" />
    </svg>
    <span id="banner-progress-text" class="font-title text-xl sm:text-2xl font-bold text-[#1E3A56] z-10">
      0%
    </span>
  </div>
</section>
